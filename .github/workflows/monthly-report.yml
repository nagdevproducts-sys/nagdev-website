name: Monthly SEO Performance Report

on:
  schedule:
    # 2nd day of each month at 01:30 UTC = 07:00 IST
    - cron: '30 1 2 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monthly-seo-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/monitoring/requirements.txt

      - name: Pull Google Search Console Data
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          python scripts/monitoring/gsc_pull.py

      - name: Pull Google Analytics 4 Data
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          python scripts/monitoring/ga4_pull.py

      - name: Pull Mobile PageSpeed Insights Data
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          python scripts/monitoring/psi_pull.py

      - name: Pull Bing Webmaster Tools Data
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          python scripts/monitoring/bing_pull.py

      - name: Run Site Health and Claims Linter Checks
        run: |
          python scripts/monitoring/site_health.py

      - name: Generate Rule-Based Recommendations
        run: |
          python scripts/monitoring/recommend.py

      - name: Assemble Markdown Report
        run: |
          python scripts/monitoring/report.py

      - name: Upload Raw Data and Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seo-monthly-report-${{ github.run_id }}
          path: monitoring_output/
          retention-days: 90

      - name: Publish GitHub Issue with Monthly Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_MONTH=$(date +"%B %Y")
          ISSUE_TITLE="SEO Monthly Report – ${REPORT_MONTH}"
          gh issue create \
            --title "${ISSUE_TITLE}" \
            --body-file monitoring_output/monthly_report.md \
            --label "seo-report"
