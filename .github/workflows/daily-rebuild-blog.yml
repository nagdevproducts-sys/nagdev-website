name: Daily Blog Rebuild & Verification

on:
  schedule:
    # 01:40 UTC daily = 07:10 IST
    - cron: '40 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pyyaml pytest requests pillow markdown-it-py

      - name: Run Blog Engine (Compile Due Posts)
        run: |
          python scripts/build_blog.py

      - name: Commit and Push Newly Due Blog Posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            echo "New blog posts or generated assets detected. Committing and pushing to main..."
            git add blog/ sitemap.xml index.html blog.html js/blog-data.js llms.txt seo/ images/blog-covers/
            git commit -m "Auto-publish scheduled blog post(s) [skip ci]"
            git push origin main
            echo "Successfully pushed to main! Vercel production build triggered."
          else
            echo "All due posts are already committed and built on disk."
          fi

      - name: Trigger Optional Vercel Deploy Hook Fallback
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Triggering VERCEL_DEPLOY_HOOK..."
            curl -s -X POST "$VERCEL_DEPLOY_HOOK" || true
          fi

      - name: Await Vercel Production Deployment & Verify Due Posts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verifying production deployment of all due posts (up to 15 min)..."
          python scripts/publish_automation.py --verify-due --ping
