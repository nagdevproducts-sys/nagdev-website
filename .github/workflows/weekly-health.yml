name: Weekly SEO Health & Performance Monitor

on:
  schedule:
    # Mondays 00:30 UTC = 06:00 IST
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/monitoring/requirements.txt

      - name: Restore previous PSI artifact for regression check
        uses: actions/cache@v4
        with:
          path: monitoring_output/prev_psi.json
          key: psi-baseline-${{ runner.os }}
          restore-keys: |
            psi-baseline-

      - name: Run Site Health Check (Sitemap, Links, Claims Lint)
        run: |
          python scripts/monitoring/site_health.py

      - name: Run Mobile PageSpeed Insights Pull
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          python scripts/monitoring/psi_pull.py

      - name: Evaluate Health and Alert on Failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import json
          import subprocess
          from pathlib import Path

          health_p = Path("monitoring_output/site_health.json")
          psi_p = Path("monitoring_output/psi_data.json")
          prev_psi_p = Path("monitoring_output/prev_psi.json")

          failures = []

          if health_p.exists():
              health = json.loads(health_p.read_text(encoding="utf-8"))
              if health.get("status") != "PASS":
                  for r in health.get("failure_reasons", []):
                      failures.append(f"- **Site Health Issue:** {r}")

          if psi_p.exists():
              psi = json.loads(psi_p.read_text(encoding="utf-8"))
              prev_psi = json.loads(prev_psi_p.read_text(encoding="utf-8")) if prev_psi_p.exists() else {}
              prev_scores = {r["url"]: r["median_score"] for r in prev_psi.get("results", []) if "median_score" in r}

              for r in psi.get("results", []):
                  u = r.get("url")
                  score = r.get("median_score")
                  if score is not None and u in prev_scores:
                      prev_s = prev_scores[u]
                      if prev_s - score > 10:
                          failures.append(f"- **Performance Regression:** {r.get('name')} dropped >10 points ({prev_s} -> {score})")
              
              # Save current as baseline for next run
              prev_psi_p.parent.mkdir(parents=True, exist_ok=True)
              prev_psi_p.write_text(json.dumps(psi, indent=2), encoding="utf-8")

          if failures:
              body = "## 🚨 Weekly SEO Health Alert\n\nThe following automated checks failed during the weekly audit:\n\n" + "\n".join(failures) + "\n\n*Please investigate and remediate immediately.*"
              print("Failures detected! Opening GitHub issue...")
              subprocess.run([
                  "gh", "issue", "create",
                  "--title", "🚨 SEO Health Alert: Weekly Audit Regressions Detected",
                  "--body", body,
                  "--label", "seo-alert"
              ], check=True)
          else:
              print("All weekly health and performance checks passed cleanly. No issue opened.")
          EOF

      - name: Check Vercel Deployment Count & Storage Guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import json
          import subprocess
          import urllib.request
          import urllib.error

          token = os.environ.get("VERCEL_TOKEN")
          if not token:
              print("VERCEL_TOKEN secret not configured; skipping Vercel deployment count check.")
              exit(0)

          project_name = "nagdev-website"
          url = f"https://api.vercel.com/v6/deployments?projectId={project_name}&limit=100"
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
                  deployments = data.get("deployments", [])
                  count = len(deployments)
                  print(f"Total Vercel deployments retrieved: {count}")

                  if count > 20:
                      title = "Vercel deployments high – run cleanup"
                      body = (
                          f"### ⚠️ Vercel Storage / Deployment Alert\n\n"
                          f"Active Vercel deployment count for **{project_name}** is currently **{count}**, which exceeds the threshold of 20.\n\n"
                          f"To prevent reaching the Vercel Hobby plan 10 GB Deployment Storage limit, run cleanup immediately:\n"
                          f"1. Keep current production + 9 rollback deployments\n"
                          f"2. Delete older deployments via `vercel remove <deployment-url> --safe --yes`\n"
                      )
                      print(f"Deployment count {count} > 20! Opening GitHub issue...")
                      check_issue = subprocess.run(
                          ["gh", "issue", "list", "--search", title, "--json", "number"],
                          capture_output=True, text=True
                      )
                      existing = json.loads(check_issue.stdout) if check_issue.returncode == 0 and check_issue.stdout.strip() else []
                      if not existing:
                          subprocess.run([
                              "gh", "issue", "create",
                              "--title", title,
                              "--body", body,
                              "--label", "maintenance"
                          ], check=True)
                          print("Opened GitHub issue: 'Vercel deployments high – run cleanup'")
                      else:
                          print("Cleanup issue already open. Skipping duplicate issue creation.")
                  else:
                      print(f"Deployment count ({count}) is healthy (<= 20).")
          except urllib.error.HTTPError as e:
              print(f"Error querying Vercel API: HTTP {e.code} - {e.read().decode()}")
          except Exception as e:
              print(f"Unexpected error checking Vercel deployments: {e}")
          EOF

      - name: Verify Newest Scheduled Blog Post HTTP 200
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import csv
          import json
          import subprocess
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          IST = timezone(timedelta(hours=5, minutes=30))
          now_ist = datetime.now(IST)

          cal_path = Path("seo/blog/calendar.csv")
          if not cal_path.exists():
              print("No calendar.csv found, skipping blog post health check.")
              exit(0)

          newest_post = None
          with open(cal_path, "r", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              posts = []
              for row in reader:
                  pub_dt = datetime.fromisoformat(row["publish_date"])
                  if pub_dt <= now_ist:
                      posts.append((pub_dt, row))
              if posts:
                  posts.sort(key=lambda x: x[0], reverse=True)
                  newest_post = posts[0][1]

          if not newest_post:
              print("No scheduled posts with publish_date <= now_ist found.")
              exit(0)

          slug = newest_post["slug"]
          url = f"https://www.nagdevproducts.com/blog/{slug}"
          print(f"Checking newest scheduled post: {url} (scheduled {newest_post['publish_date']})")

          headers = {"User-Agent": "Nagdev-Weekly-Health-Check/1.0"}
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  if resp.status == 200:
                      print(f"[PASSED] Post URL returned HTTP 200 OK: {url}")
                  else:
                      raise urllib.error.HTTPError(url, resp.status, "Non-200 status", resp.headers, None)
          except Exception as e:
              print(f"[FAILED] Error reaching newest post URL {url}: {e}")
              title = f"🚨 Newest scheduled blog post returned non-200: {slug}"
              body = (
                  f"### 🚨 Production Blog Post Health Failure\n\n"
                  f"The newest scheduled blog post failed production HTTP 200 verification.\n\n"
                  f"- **Post Slug:** `{slug}`\n"
                  f"- **URL:** {url}\n"
                  f"- **Scheduled Date (IST):** {newest_post['publish_date']}\n"
                  f"- **Error:** `{e}`\n\n"
                  f"Please verify Vercel deployment status and ensure the post is rendered in `blog/{slug}.html`."
              )
              subprocess.run([
                  "gh", "issue", "create",
                  "--title", title,
                  "--body", body,
                  "--label", "seo-alert"
              ], check=True)
              exit(1)
          EOF

      - name: Upload Health Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-health-data
          path: monitoring_output/
          retention-days: 30
