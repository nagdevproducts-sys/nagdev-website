name: Weekly SEO Health & Performance Monitor

on:
  schedule:
    # Mondays 00:30 UTC = 06:00 IST
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/monitoring/requirements.txt
          pip install beautifulsoup4 requests pyyaml pillow markdown-it-py

      - name: Restore previous PSI artifact for regression check
        uses: actions/cache@v4
        with:
          path: monitoring_output/prev_psi.json
          key: psi-baseline-${{ runner.os }}
          restore-keys: |
            psi-baseline-

      - name: Run Site Health Check (Sitemap, Links, Claims Lint)
        continue-on-error: true
        run: |
          python scripts/monitoring/site_health.py

      - name: "Run PageSpeed Insights Pull (Fixed Sample: Mobile + Desktop)"
        continue-on-error: true
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          python scripts/monitoring/psi_pull.py

      - name: Check Vercel Deployment Count & Storage Guard
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import json
          import subprocess
          import urllib.request
          import urllib.error

          token = os.environ.get("VERCEL_TOKEN")
          if not token:
              print("VERCEL_TOKEN secret not configured; skipping Vercel deployment count check.")
              exit(0)

          project_name = "nagdev-website"
          url = f"https://api.vercel.com/v6/deployments?projectId={project_name}&limit=100"
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
                  deployments = data.get("deployments", [])
                  count = len(deployments)
                  print(f"Total Vercel deployments retrieved: {count}")

                  if count > 20:
                      title = "Vercel deployments high – run cleanup"
                      body = (
                          f"### ⚠️ Vercel Storage / Deployment Alert\n\n"
                          f"Active Vercel deployment count for **{project_name}** is currently **{count}**, which exceeds the threshold of 20.\n\n"
                          f"To prevent reaching the Vercel Hobby plan 10 GB Deployment Storage limit, run cleanup immediately:\n"
                          f"1. Keep current production + 9 rollback deployments\n"
                          f"2. Delete older deployments via `vercel remove <deployment-url> --safe --yes`\n"
                      )
                      print(f"Deployment count {count} > 20! Checking for existing issue...")
                      check_issue = subprocess.run(
                          ["gh", "issue", "list", "--search", title, "--json", "number"],
                          capture_output=True, text=True
                      )
                      existing = json.loads(check_issue.stdout) if check_issue.returncode == 0 and check_issue.stdout.strip() else []
                      if not existing:
                          subprocess.run([
                              "gh", "issue", "create",
                              "--title", title,
                              "--body", body,
                              "--label", "maintenance"
                          ], check=True)
                          print("Opened GitHub issue: 'Vercel deployments high – run cleanup'")
                      else:
                          print("Cleanup issue already open. Skipping duplicate issue creation.")
                  else:
                      print(f"Deployment count ({count}) is healthy (<= 20).")
          except Exception as e:
              print(f"Notice: Vercel deployment check encountered error: {e}")
          EOF

      - name: Evaluate Health and Alert on Regressions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import json
          import subprocess
          import sys
          from pathlib import Path

          health_p = Path("monitoring_output/site_health.json")
          psi_p = Path("monitoring_output/psi_data.json")
          prev_psi_p = Path("monitoring_output/prev_psi.json")

          regressions = []
          monitor_errors = []

          # 1. Site Health checks (Sitemap 200s, redirect chains, broken links, claims lint, JSON-LD)
          if health_p.exists():
              health = json.loads(health_p.read_text(encoding="utf-8"))
              if health.get("status") != "PASS":
                  for r in health.get("failure_reasons", []):
                      regressions.append(f"- **Site Health Regression:** {r}")
              
              # Log sitemap or link crawler timeouts as monitor errors, not regressions
              for me in health.get("sitemap_check", {}).get("monitor_errors", []):
                  monitor_errors.append(f"Sitemap crawl timeout/error on {me.get('url')}: {me.get('error')}")
              for me in health.get("internal_links_check", {}).get("monitor_errors", []):
                  monitor_errors.append(f"Internal link crawl timeout/error on {me.get('url')}: {me.get('error')}")
          else:
              monitor_errors.append("site_health.json was not generated (monitoring step error)")

          # 2. PageSpeed Insights performance regressions
          if psi_p.exists():
              psi = json.loads(psi_p.read_text(encoding="utf-8"))
              prev_psi = json.loads(prev_psi_p.read_text(encoding="utf-8")) if prev_psi_p.exists() else {}
              prev_scores = {f"{r.get('url')}_{r.get('strategy', 'mobile')}": r.get("score") for r in prev_psi.get("results", []) if r.get("score") is not None}

              for r in psi.get("results", []):
                  u = r.get("url")
                  strat = r.get("strategy", "mobile")
                  score = r.get("score")
                  key = f"{u}_{strat}"
                  if score is not None and key in prev_scores:
                      prev_s = prev_scores[key]
                      if prev_s - score > 10:
                          regressions.append(f"- **Performance Regression:** {r.get('name')} ({strat}) dropped >10 points ({prev_s} -> {score})")
              
              for me in psi.get("monitor_errors", []):
                  monitor_errors.append(f"PSI API rate-limit/error on {me.get('url')} ({me.get('strategy')}): {me.get('error')}")

              # Save current valid psi data as baseline cache for next week
              if psi.get("results"):
                  prev_psi_p.parent.mkdir(parents=True, exist_ok=True)
                  prev_psi_p.write_text(json.dumps(psi, indent=2), encoding="utf-8")
          else:
              monitor_errors.append("psi_data.json was not generated (monitoring step error)")

          # 3. Report Monitor Warnings
          if monitor_errors:
              print("=== MONITOR NOTICES (Non-breaking tool/network errors) ===")
              for me in monitor_errors:
                  print(f"  [NOTICE] {me}")

          # 4. Handle Real Site Regressions
          if regressions:
              title = "🚨 SEO Health Alert: Weekly Audit Regressions Detected"
              body = (
                  "## 🚨 Weekly SEO Health Alert\n\n"
                  "The following genuine site regressions were detected during the weekly automated health audit:\n\n" +
                  "\n".join(regressions) +
                  "\n\n*Please investigate and remediate.*"
              )
              print("\nRegressions detected! Checking for existing open issue to update...")
              
              # Check for existing open issue with label seo-alert
              check_issue = subprocess.run(
                  ["gh", "issue", "list", "--state", "open", "--label", "seo-alert", "--json", "number,title"],
                  capture_output=True, text=True
              )
              existing_issues = []
              if check_issue.returncode == 0 and check_issue.stdout.strip():
                  try:
                      existing_issues = json.loads(check_issue.stdout)
                  except Exception:
                      pass

              if existing_issues:
                  issue_num = existing_issues[0]["number"]
                  print(f"Updating existing open issue #{issue_num} instead of creating duplicate...")
                  comment_body = f"### 🔄 Weekly Health Audit Update\n\nActive regressions detected on this run:\n\n" + "\n".join(regressions)
                  subprocess.run(["gh", "issue", "comment", str(issue_num), "--body", comment_body], check=True)
              else:
                  print("Creating new GitHub issue...")
                  subprocess.run([
                      "gh", "issue", "create",
                      "--title", title,
                      "--body", body,
                      "--label", "seo-alert"
                  ], check=True)

              sys.exit(1)
          else:
              print("\n[PASSED] All weekly site health and performance regression checks passed cleanly!")
          EOF

      - name: Upload Health Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-health-data
          path: monitoring_output/
          retention-days: 30
